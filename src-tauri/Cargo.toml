[package]
name = "meta-cognition-notebook"
version = "0.4.0"
description = "MetaCognition Notebook - A modern desktop writing and knowledge-management application"
authors = ["MetaCognition Team"]
edition = "2021"

[lib]
name = "meta_cognition_notebook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
tempfile = "3"
